[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "price"
version = "0.1.0"
description = "PRICE: An Operator Recomputation and Fission Framework for Computation Graphs via Attainable Arithmetic Intensity"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=1.10.0",
    "torchvision>=0.11.1",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "psutil>=5.8.0",
    "loguru",
    "xxhash",
    "sympy",
    "rustworkx",
]
